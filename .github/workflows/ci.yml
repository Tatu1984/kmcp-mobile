name: CI

# packages/api is shared with kmcp-vendor, in its own repository, with nothing
# enforcing that the two copies stay identical. Typechecking every workspace on
# every push at least catches a change that breaks this app's own use of it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck every workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test --if-present
